name: Android release APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after the signed build succeeds
        required: true
        default: false
        type: boolean
      tag:
        description: Release tag (required when publish is true, for example android-v0.1.0)
        required: false
        type: string

# The build only needs to read the repository. The publish job grants write
# access explicitly, so a normal manual build cannot create or change releases.
permissions:
  contents: read

env:
  EXPO_PUBLIC_API_BASE_URL: https://digitvav3.causeofdeathindia.com
  DIGITVA_ANDROID_RELEASE_BUILD: "1"
  DIGITVA_ANDROID_VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.app_version.outputs.version }}
    env:
      ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/digitva-release.keystore
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/digitva-collect/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?ANDROID_RELEASE_KEYSTORE_BASE64 is not configured}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?ANDROID_RELEASE_KEYSTORE_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?ANDROID_RELEASE_KEY_ALIAS is not configured}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?ANDROID_RELEASE_KEY_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_CERT_SHA256:?Repository variable ANDROID_RELEASE_CERT_SHA256 is not configured}"
          if [[ ! "$ANDROID_RELEASE_CERT_SHA256" =~ ^([[:xdigit:]]{2}:?){32}$ ]]; then
            echo "ANDROID_RELEASE_CERT_SHA256 must contain a SHA-256 certificate fingerprint" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_STORE_FILE"
          test -s "$ANDROID_RELEASE_STORE_FILE"
          keytool -list -keystore "$ANDROID_RELEASE_STORE_FILE" \
            -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD >/dev/null

      - name: Set up pnpm 11.9
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Build the vendored WHO package
        run: |
          pnpm --dir vendor/who-va-2022 install --frozen-lockfile
          pnpm --dir vendor/who-va-2022 run build

      - name: Install mobile dependencies from the lockfile
        working-directory: mobile/digitva-collect
        run: npm ci

      - name: Run mobile typecheck
        working-directory: mobile/digitva-collect
        run: npm run typecheck

      - name: Run mobile tests
        working-directory: mobile/digitva-collect
        run: npm test -- --runInBand

      - name: Read Expo app version
        id: app_version
        working-directory: mobile/digitva-collect
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./app.json').expo.version")"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expo app version must be numeric semver: $app_version" >&2
            exit 1
          }
          printf 'version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"

      - name: Generate the native Android project
        working-directory: mobile/digitva-collect
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build the signed release APK
        working-directory: mobile/digitva-collect/android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify and checksum the APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find mobile/digitva-collect/android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          scripts/verify-android-release.sh "$apk" "$ANDROID_RELEASE_CERT_SHA256" "$EXPO_PUBLIC_API_BASE_URL" "$DIGITVA_ANDROID_VERSION_CODE"
          cp "$apk" "$RUNNER_TEMP/digitva-collect.apk"
          (cd "$RUNNER_TEMP" && sha256sum digitva-collect.apk > digitva-collect.apk.sha256)

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digitva-collect-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/digitva-collect.apk
            ${{ runner.temp }}/digitva-collect.apk.sha256

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$ANDROID_RELEASE_STORE_FILE"

  publish:
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main' && inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digitva-collect-android-${{ github.sha }}
          path: release-assets

      - name: Publish stable release assets
        env:
          INPUT_TAG: ${{ inputs.tag }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${INPUT_TAG:-}"
          expected_tag="android-v${APP_VERSION}"
          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag must exactly match Expo version: $expected_tag" >&2
            exit 1
          fi
          test -s release-assets/digitva-collect.apk
          test -s release-assets/digitva-collect.apk.sha256
          gh release create "$release_tag" \
            release-assets/digitva-collect.apk \
            release-assets/digitva-collect.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --notes "Signed DigitVA Collect Android APK for $release_tag."
