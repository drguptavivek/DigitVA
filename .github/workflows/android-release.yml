name: Android release APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after the signed build succeeds
        required: true
        default: false
        type: boolean
      tag:
        description: Release tag (required when publish is true, for example android-v0.2.0)
        required: false
        type: string

# The build only needs to read the repository. The publish job grants write
# access explicitly, so a normal manual build cannot create or change releases.
permissions:
  contents: read

env:
  EXPO_PUBLIC_API_BASE_URL: https://digitvav3.causeofdeathindia.com
  DIGITVA_ANDROID_RELEASE_BUILD: "1"
  # Temporary field testing allowance; screenshots block again automatically after this instant.
  EXPO_PUBLIC_ALLOW_SCREENSHOTS_UNTIL: "2026-11-25T08:12:11Z"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.app_version.outputs.version }}
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/digitva-collect/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_RELEASE_STORE_FILE="$RUNNER_TEMP/digitva-release.keystore"
          printf 'ANDROID_RELEASE_STORE_FILE=%s\n' "$ANDROID_RELEASE_STORE_FILE" >> "$GITHUB_ENV"
          : "${KEYSTORE_BASE64:?ANDROID_RELEASE_KEYSTORE_BASE64 is not configured}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?ANDROID_RELEASE_KEYSTORE_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?ANDROID_RELEASE_KEY_ALIAS is not configured}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?ANDROID_RELEASE_KEY_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_CERT_SHA256:?Repository variable ANDROID_RELEASE_CERT_SHA256 is not configured}"
          if [[ ! "$ANDROID_RELEASE_CERT_SHA256" =~ ^([[:xdigit:]]{2}:?){32}$ ]]; then
            echo "ANDROID_RELEASE_CERT_SHA256 must contain a SHA-256 certificate fingerprint" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_STORE_FILE"
          test -s "$ANDROID_RELEASE_STORE_FILE"
          keytool -list -keystore "$ANDROID_RELEASE_STORE_FILE" \
            -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD >/dev/null

      - name: Set up pnpm 11.9
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Build the vendored WHO package
        run: |
          pnpm --dir vendor/who-va-2022 install --frozen-lockfile
          pnpm --dir vendor/who-va-2022 run build

      - name: Install mobile dependencies from the lockfile
        working-directory: mobile/digitva-collect
        run: npm ci

      - name: Run mobile typecheck
        working-directory: mobile/digitva-collect
        run: npm run typecheck

      - name: Run mobile tests
        working-directory: mobile/digitva-collect
        run: npm test -- --runInBand

      - name: Read Expo app version
        id: app_version
        working-directory: mobile/digitva-collect
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./app.json').expo.version")"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expo app version must be numeric semver: $app_version" >&2
            exit 1
          }
          printf 'version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"
          # Base versionCode from the version (0.2.0 -> 200); each ABI APK
          # gets base * 10 + ABI digit (plugins/with-android-abi-splits.js).
          IFS=. read -r major minor patch <<<"$app_version"
          (( minor < 100 && patch < 100 )) || { echo "minor and patch must be below 100" >&2; exit 1; }
          printf 'DIGITVA_ANDROID_VERSION_CODE=%s\n' "$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        working-directory: mobile/digitva-collect
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build the signed per-ABI release APKs
        working-directory: mobile/digitva-collect/android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify and checksum the APKs
        id: verify
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=mobile/digitva-collect/android/app/build/outputs/apk/release
          mkdir -p "$RUNNER_TEMP/release-assets"
          for abi_digit in armeabi-v7a:1 arm64-v8a:2; do
            abi="${abi_digit%%:*}"
            apk="$apk_dir/app-${abi}-release.apk"
            scripts/verify-android-release.sh "$apk" "$ANDROID_RELEASE_CERT_SHA256" "$EXPO_PUBLIC_API_BASE_URL" "$((DIGITVA_ANDROID_VERSION_CODE * 10 + ${abi_digit##*:}))"
            name="digitva-collect-${APP_VERSION}-${abi}.apk"
            cp "$apk" "$RUNNER_TEMP/release-assets/$name"
            (cd "$RUNNER_TEMP/release-assets" && sha256sum "$name" > "$name.sha256")
          done

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digitva-collect-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/release-assets/

      # The Gradle Hermes bundle task composes this map from the Metro and
      # Hermes maps; it is not packaged in the APK. Workflow artifacts only, never
      # a GitHub release asset. Retention is the repository maximum (90 days).
      - name: Upload Hermes source map (Collect)
        # A missing map is a warning, not a blocked release.
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-sourcemap-collect-${{ steps.app_version.outputs.version }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: mobile/digitva-collect/android/app/build/generated/sourcemaps/react/release/index.android.bundle.map

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$ANDROID_RELEASE_STORE_FILE"

  publish:
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main' && inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digitva-collect-android-${{ github.sha }}
          path: release-assets

      - name: Publish stable release assets
        env:
          INPUT_TAG: ${{ inputs.tag }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${INPUT_TAG:-}"
          expected_tag="android-v${APP_VERSION}"
          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag must exactly match Expo version: $expected_tag" >&2
            exit 1
          fi
          for abi in armeabi-v7a arm64-v8a; do
            test -s "release-assets/digitva-collect-${APP_VERSION}-${abi}.apk"
            test -s "release-assets/digitva-collect-${APP_VERSION}-${abi}.apk.sha256"
          done
          gh release create "$release_tag" \
            release-assets/digitva-collect-"${APP_VERSION}"-*.apk \
            release-assets/digitva-collect-"${APP_VERSION}"-*.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DigitVA ${APP_VERSION}" \
            --notes "Signed DigitVA Collect Android APKs for $release_tag: arm64-v8a for most phones, armeabi-v7a for older 32-bit phones."
