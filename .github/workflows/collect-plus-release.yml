name: Collect Plus Android release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a public GitHub release after the signed build succeeds
        required: true
        default: false
        type: boolean
      tag:
        description: Release tag (required when publish is true, for example collect-plus-v0.3.10-plus.1)
        required: false
        type: string

# The build only reads the repository and the engine release. The publish job grants write access explicitly.
permissions:
  contents: read

env:
  EXPO_PUBLIC_API_BASE_URL: https://digitva.causeofdeathindia.com
  DIGITVA_ANDROID_RELEASE_BUILD: "1"
  # The offline ICD-11 engine release this build stages. scripts/icd11-engine.env holds the same version; a step
  # checks the two match.
  ICD11_ENGINE_TAG: icd11-engine-v2026.10.25.1
  # sha256 of icd11-engine-<version>.tar.gz, printed by scripts/publish-icd11-engine.sh after the owner publishes the
  # engine release. Until it is set, the build fails at once (the placeholder is not a sha256).
  ICD11_ENGINE_SHA256: REPLACE_WITH_ENGINE_SHA256

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.app_version.outputs.version }}
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - name: Stop while the engine pin is a placeholder
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ICD11_ENGINE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ICD11_ENGINE_SHA256 in collect-plus-release.yml is not set. Publish the engine release with" >&2
            echo "scripts/publish-icd11-engine.sh, then pin the sha256 it prints here." >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the engine pin matches scripts/icd11-engine.env
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/icd11-engine.env
          . scripts/icd11-engine.env
          expected="icd11-engine-v${ICD11_ENGINE_VERSION}"
          if [[ "$ICD11_ENGINE_TAG" != "$expected" ]]; then
            echo "ICD11_ENGINE_TAG ($ICD11_ENGINE_TAG) does not match scripts/icd11-engine.env ($expected)" >&2
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/digitva-collect/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_RELEASE_STORE_FILE="$RUNNER_TEMP/digitva-release.keystore"
          printf 'ANDROID_RELEASE_STORE_FILE=%s\n' "$ANDROID_RELEASE_STORE_FILE" >> "$GITHUB_ENV"
          : "${KEYSTORE_BASE64:?ANDROID_RELEASE_KEYSTORE_BASE64 is not configured}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?ANDROID_RELEASE_KEYSTORE_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?ANDROID_RELEASE_KEY_ALIAS is not configured}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?ANDROID_RELEASE_KEY_PASSWORD is not configured}"
          : "${ANDROID_RELEASE_CERT_SHA256:?Repository variable ANDROID_RELEASE_CERT_SHA256 is not configured}"
          if [[ ! "$ANDROID_RELEASE_CERT_SHA256" =~ ^([[:xdigit:]]{2}:?){32}$ ]]; then
            echo "ANDROID_RELEASE_CERT_SHA256 must contain a SHA-256 certificate fingerprint" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_STORE_FILE"
          test -s "$ANDROID_RELEASE_STORE_FILE"
          keytool -list -keystore "$ANDROID_RELEASE_STORE_FILE" \
            -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD >/dev/null

      - name: Set up pnpm 11.9
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Build the vendored WHO package
        run: |
          pnpm --dir vendor/who-va-2022 install --frozen-lockfile
          pnpm --dir vendor/who-va-2022 run build

      - name: Install mobile dependencies from the lockfile
        working-directory: mobile/digitva-collect
        run: npm ci

      - name: Run mobile typecheck
        working-directory: mobile/digitva-collect
        run: npm run typecheck

      - name: Run mobile tests
        working-directory: mobile/digitva-collect
        run: npm test -- --runInBand

      - name: Free runner disk for the engine
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # Toolchains this build does not use; the Android SDK and NDK stay.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch and verify the offline ICD-11 engine
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=../../scripts/icd11-engine.env
          . scripts/icd11-engine.env
          name="icd11-engine-${ICD11_ENGINE_VERSION}.tar.gz"
          download="$RUNNER_TEMP/icd11-engine-download"
          mkdir -p "$download"
          gh release download "$ICD11_ENGINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$download"
          # The pinned sha256 decides, not the checksum file in the release.
          echo "$ICD11_ENGINE_SHA256  $download/$name" | sha256sum -c -
          engine="$RUNNER_TEMP/icd11-engine"
          mkdir -p "$engine"
          tar -xzf "$download/$name" -C "$engine"
          test -s "$engine/bridge-aot/pub-bionic/digitva_icd11.so"
          rm -rf "$download"
          # stage-engine.js reads the extracted folder (same layout as private/icd11-offline-spike).
          printf 'DIGITVA_ICD11_SPIKE_DIR=%s\n' "$engine" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Read Expo app version
        id: app_version
        working-directory: mobile/digitva-collect
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./app.json').expo.version")"
          [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expo app version must be numeric semver: $app_version" >&2
            exit 1
          }
          printf 'version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"
          # Same versionCode base as android-release.yml; the arm64 APK gets base * 10 + 2.
          IFS=. read -r major minor patch <<<"$app_version"
          (( minor < 100 && patch < 100 )) || { echo "minor and patch must be below 100" >&2; exit 1; }
          printf 'DIGITVA_ANDROID_VERSION_CODE=%s\n' "$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        working-directory: mobile/digitva-collect
        env:
          APP_VARIANT: plus
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build the signed arm64 Collect Plus APK
        working-directory: mobile/digitva-collect/android
        env:
          APP_VARIANT: plus
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Verify and checksum the APK
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          apk=mobile/digitva-collect/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          name="digitva-collect-plus-${APP_VERSION}-arm64-v8a.apk"
          scripts/verify-android-release.sh "$apk" "$ANDROID_RELEASE_CERT_SHA256" "$EXPO_PUBLIC_API_BASE_URL" \
            "$((DIGITVA_ANDROID_VERSION_CODE * 10 + 2))" com.causeofdeathindia.digitvacollect.plus
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$apk" "$RUNNER_TEMP/release-assets/$name"
          (cd "$RUNNER_TEMP/release-assets" && sha256sum "$name" > "$name.sha256")

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collect-plus-android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/release-assets/

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$ANDROID_RELEASE_STORE_FILE"

  publish:
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main' && inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collect-plus-android-${{ github.sha }}
          path: release-assets

      - name: Publish the public Collect Plus release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${INPUT_TAG:-}"
          case "$release_tag" in
            collect-plus-v"$APP_VERSION"-plus.*) ;;
            *)
              echo "Release tag must be collect-plus-v$APP_VERSION-plus.N" >&2
              exit 1
              ;;
          esac
          [[ "${release_tag##*.}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Release tag must end in -plus.N with N a positive integer" >&2
            exit 1
          }
          apk="release-assets/digitva-collect-plus-${APP_VERSION}-arm64-v8a.apk"
          test -s "$apk"
          test -s "$apk.sha256"
          gh release create "$release_tag" "$apk" "$apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "DigitVA Collect Plus ${APP_VERSION}" \
            --notes "Experimental DigitVA Collect Plus (offline coding), arm64-v8a only. It installs beside the normal DigitVA Collect app. Built from $GITHUB_SHA with the offline ICD-11 engine release $ICD11_ENGINE_TAG. WHO ICD-11 is licensed CC BY-ND 3.0 IGO; the engine is compiled from WHO ICD-API 2.6.0 and DORIS rules 1.2.0 (see docs/policy/icd11-local-api-runtime.md). SHA-256 is in the attached .sha256 file."
