name: Expo web export release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release after the web export builds
        required: true
        default: false
        type: boolean
      tag:
        description: Release tag (required when publish is true, for example expo-web-v2026.10.25.1)
        required: false
        type: string

# The build only reads the repository. The publish job grants write access explicitly.
permissions:
  contents: read

jobs:
  build-who:
    name: Build WHO package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          # A tag names the archive file even without publishing, so it is always checked when given.
          if [[ "$PUBLISH" == "true" || -n "$INPUT_TAG" ]]; then
            [[ "$INPUT_TAG" =~ ^expo-web-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || {
              echo "Release tag must look like expo-web-v2026.10.25.1" >&2
              exit 1
            }
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up pnpm 11.9
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Build the vendored WHO package
        run: |
          pnpm --dir vendor/who-va-2022 install --frozen-lockfile
          pnpm --dir vendor/who-va-2022 run typecheck
          pnpm --dir vendor/who-va-2022 run build

      - name: Check WHO entrypoint boundaries
        run: pnpm --dir vendor/who-va-2022 exec vitest run tests/web-preloaded.test.ts tests/runtime-boundary.test.ts --no-file-parallelism

      - name: Package the matched WHO build
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node --test scripts/tests/who-package-build.test.mjs
          node scripts/build-who-package.mjs package vendor/who-va-2022 "$RUNNER_TEMP/who-build" "${INPUT_TAG:-expo-web-dev-${GITHUB_SHA:0:7}}" "$GITHUB_SHA"

      - name: Upload WHO package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: who-package-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/who-build/

  build:
    name: Build DigitVA app
    needs: build-who
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/digitva-collect/package-lock.json

      - name: Download the matched WHO build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: who-package-${{ github.sha }}
          path: ${{ runner.temp }}/who-build

      - name: Verify and install the WHO build input
        run: node scripts/build-who-package.mjs install "$RUNNER_TEMP/who-build" vendor/who-va-2022 "$GITHUB_SHA"

      - name: Install mobile dependencies from the lockfile
        working-directory: mobile/digitva-collect
        run: npm ci

      - name: Verify the installed WHO package
        run: node scripts/build-who-package.mjs verify-installed "$RUNNER_TEMP/who-build" mobile/digitva-collect/node_modules/@drguptavivek/who-2022-va "$GITHUB_SHA"

      - name: Run mobile tests
        working-directory: mobile/digitva-collect
        run: npm test -- --runInBand

      - name: Check mobile types
        working-directory: mobile/digitva-collect
        run: npm run typecheck

      - name: Export the web bundle
        working-directory: mobile/digitva-collect
        run: npm run export:web

      - name: Version public web assets
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node --test scripts/tests/expo-web-cache.test.mjs
          node scripts/build-expo-web-cache.mjs mobile/digitva-collect/dist "${INPUT_TAG:-expo-web-dev-${GITHUB_SHA:0:7}}" "$GITHUB_SHA" "$RUNNER_TEMP/who-build/who-build.json"
          mkdir -p "$RUNNER_TEMP/release-assets"
          node --test scripts/tests/expo-web-profile.test.mjs
          node scripts/profile-expo-web.mjs mobile/digitva-collect/dist "$RUNNER_TEMP/release-assets/web-bundle-profile.json" --require-who

      - name: Summarize web bundle profile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/release-assets/web-bundle-profile.json"
          if [[ ! -s "$profile" ]]; then
            echo "## Expo web bundle profile" >> "$GITHUB_STEP_SUMMARY"
            echo "The profiler did not produce a report; inspect the failed build step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node --input-type=module - "$profile" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const largest = report.largest_chunks.slice(0, 5).map((chunk) => `| ${chunk.path} | ${chunk.raw_bytes} | ${chunk.gzip_bytes} |`).join("\n");
          console.log("## Expo web bundle profile");
          console.log(`Initial JavaScript: **${report.initial.raw_bytes} raw bytes**, **${report.initial.gzip_bytes} gzip bytes**.`);
          console.log(`Deferred JavaScript: ${report.deferred.raw_bytes} raw bytes, ${report.deferred.gzip_bytes} gzip bytes.`);
          console.log(`Runtime chunks: ${report.deferred.runtime_chunks.map((chunk) => chunk.path).join(", ") || "none"}.`);
          console.log("\n| Largest chunk | Raw bytes | Gzip bytes |\n| --- | ---: | ---: |\n" + largest);
          NODE

      - name: Package and checksum the export
        id: package
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -s mobile/digitva-collect/dist/index.html
          test -s mobile/digitva-collect/dist/ui-strings/en.json
          test -s "$RUNNER_TEMP/release-assets/web-bundle-profile.json"
          name="${INPUT_TAG:-expo-web-dev-${GITHUB_SHA:0:7}}"
          archive="$RUNNER_TEMP/release-assets/$name.tar.gz"
          mkdir -p "$RUNNER_TEMP/release-assets"
          # Fixed order, owners and mtime, so the same export gives the same bytes.
          (cd mobile/digitva-collect/dist && LC_ALL=C tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='2026-01-01 00:00:00 UTC' -cf - .) | gzip -n > "$archive"
          tar -tzf "$archive" > "$RUNNER_TEMP/listing.txt"
          if grep -Eq '(^|/)\._' "$RUNNER_TEMP/listing.txt"; then
            echo "export has AppleDouble (._) entries; refusing to publish it" >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP/release-assets" && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "$archive.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload export artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expo-web-${{ github.sha }}
          # Keep the size report available when an acceptance gate fails.
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/release-assets/

  publish:
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main' && inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download export artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: expo-web-${{ github.sha }}
          path: release-assets

      - name: Download WHO package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: who-package-${{ github.sha }}
          path: who-build

      - name: Publish the expo web release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="release-assets/$TAG.tar.gz"
          test -s "$archive"
          test -s "$archive.sha256"
          who_archive="who-build/$TAG-who-package.tgz"
          test -s "$who_archive"
          test -s "$who_archive.sha256"
          test -s who-build/who-build.json
          (cd release-assets && sha256sum -c "$TAG.tar.gz.sha256")
          (cd who-build && sha256sum -c "$TAG-who-package.tgz.sha256")
          sha="$(cut -d' ' -f1 "$archive.sha256")"
          notes="$(printf '%s\n\n%s\n\n%s' \
            "Expo web export of mobile/digitva-collect (served by the server at /app/, including ui-strings), built from ${GITHUB_SHA:0:9}." \
            "SHA-256: $sha  $TAG.tar.gz" \
            "The Docker build's expo_web stage downloads and verifies it from the EXPO_WEB_TAG / EXPO_WEB_SHA256 pins in docker-compose.yml (x-release-pins).")"
          gh release create "$TAG" "$archive" "$archive.sha256" "$who_archive" "$who_archive.sha256" who-build/who-build.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "DigitVA Expo web export ${TAG#expo-web-v}" \
            --notes "$notes"
