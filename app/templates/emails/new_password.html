{% extends "emails/email_base.html" %}

{% block email_title %}Your DigitVA password{% endblock %}

{% block email_body %}
<p style="margin: 0 0 16px 0; color: #212529; font-size: 16px;">
  Your DigitVA password is:
</p>
<p style="margin: 0 0 24px 0; font-family: monospace; font-size: 20px; color: #212529;">{{ password }}</p>
<p style="margin: 0 0 16px 0; color: #495057; font-size: 15px;">
  Sign in at <a href="{{ login_url }}" style="color: #0d6efd;">{{ login_url }}</a>
</p>
<p style="margin: 0; color: #6c757d; font-size: 13px;">
  Your previous password, if you had one, no longer works.
</p>
{% endblock %}
