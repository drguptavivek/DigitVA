{% extends 'va_frontpages/va_base.html' %}
{% block title %}DigitVA | VA Intake{% endblock %}
{% block content %}
<h2 class="text-primary mb-2" style="font-size: 24px; font-weight: 600;">VA Intake</h2>
<p class="text-muted small">Register deaths and fill the WHO 2022 verbal autopsy questionnaire for your team's cases.</p>
<div id="intake-alert" class="alert d-none small py-2" role="alert"></div>
<div class="row g-2 align-items-end mb-3">
  <div class="col-12 col-md-5">
    <label class="form-label small mb-1" for="intake-scope">Project and site</label>
    <select id="intake-scope" class="form-select form-select-sm"></select>
  </div>
  <div class="col-12 col-md-7 d-none" id="intake-unit-wrap">
    <div class="d-flex flex-wrap gap-2" id="intake-unit-levels"></div>
  </div>
  <div class="col-12 d-flex flex-wrap gap-2">
    <a class="btn btn-sm btn-outline-primary d-none" id="intake-new-death" href="{{ url_for('intake.new_death_page') }}"><i class="fa-solid fa-plus me-1"></i>Register death</a>
    <button type="button" class="btn btn-sm btn-primary d-none" id="intake-new-direct"><i class="fa-solid fa-file-pen me-1"></i>Start new interview</button>
  </div>
</div>

<section id="intake-worklist" data-csrf="{{ csrf_token() }}" data-user-tz="{{ current_user.timezone or 'Asia/Kolkata' }}" aria-label="Worklist">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
    <ul class="nav nav-pills nav-fill flex-grow-1 small" id="intake-tabs" role="tablist">
      <li class="nav-item" role="presentation"><button type="button" class="nav-link px-2 py-1" data-tab="visit" role="tab">To visit <span class="badge text-bg-light" data-count="visit">0</span></button></li>
      <li class="nav-item" role="presentation"><button type="button" class="nav-link px-2 py-1" data-tab="progress" role="tab">In progress <span class="badge text-bg-light" data-count="progress">0</span></button></li>
      <li class="nav-item" role="presentation"><button type="button" class="nav-link px-2 py-1" data-tab="done" role="tab">Done <span class="badge text-bg-light" data-count="done">0</span></button></li>
    </ul>
    <div class="form-check form-switch mb-0 small">
      <input class="form-check-input" type="checkbox" role="switch" id="intake-mine">
      <label class="form-check-label" for="intake-mine">Mine only</label>
    </div>
  </div>
  <p class="text-muted small mb-2" id="intake-worklist-scope">Team cases in your scope.</p>
  <ul class="list-group mb-2" id="intake-worklist-rows" aria-live="polite"></ul>
  <p class="text-muted small d-none" id="intake-worklist-empty">No cases here.</p>
  <button type="button" class="btn btn-sm btn-outline-secondary w-100 d-none" id="intake-load-more">Load more</button>
</section>
<script id="intake-context" type="application/json">{{ context | tojson }}</script>
<script src="{{ url_for('static', filename='js/intake/intake_worklist.js') }}?v={{ config.STATIC_ASSET_VERSION|urlencode }}"></script>
{% endblock %}
