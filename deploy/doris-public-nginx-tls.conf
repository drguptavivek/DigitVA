# HTTPS ingress for split production (docker-compose.external-db.yml): the
# reverse proxy reaches it on port 8000 over verified TLS (proxy_ssl_name
# <BACKEND_TLS_NAME>); it routes the public DORIS demo and the clinical app
# exactly as the plain ingress does. The private key is mounted here only.
include /etc/nginx/digitva/ingress-common.conf;

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/digitva-app/tls/server.crt;
    ssl_certificate_key /etc/digitva-app/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/digitva/ingress-routes.conf;
}
