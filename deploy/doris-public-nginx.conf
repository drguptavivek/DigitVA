log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log privacy;

    location = /help/doris-demo {
        proxy_pass http://doris_public_service:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/doris-demo/ {
        proxy_pass http://doris_public_service:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://minerva_app_service:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }
}
