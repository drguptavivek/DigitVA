log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';

# ponytail: forwarded headers from the DMZ reverse proxy pass through unchanged
# so ProxyFix(x_for=1, x_proto=1) in the apps sees the real client and https.
# The cloud firewall (only the RP VM can reach this ingress) is the trust
# boundary; if the ingress port is ever reachable by clients directly they can
# spoof their IP. Upgrade path: the real_ip module with set_real_ip_from <RP IP>.
map $http_x_forwarded_for $fwd_for {
    "" $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_forwarded_proto $fwd_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log privacy;

    # Docker DNS, re-resolved so app container restarts do not leave a stale
    # upstream IP (502) until the ingress restarts. Variable proxy_pass
    # without a URI part forwards the original request URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $clinical_upstream http://minerva_app_service:5000;
    set $public_upstream http://doris_public_service:5001;

    location = /help/doris-demo {
        proxy_pass $public_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $fwd_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location ^~ /api/v1/doris-demo/ {
        proxy_pass $public_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $fwd_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location / {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $fwd_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }
}
