# Local-only router for `make dev-hmr`. Metro serves Expo routes at `/` because
# Expo Router 57 does not strip its configured base URL in development.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80;
    server_name _;
    absolute_redirect off;

    set $metro_upstream http://digitva_web_hmr:8081;
    set $clinical_upstream http://minerva_app_service:5000;

    client_max_body_size 55m;
    access_log /var/log/nginx/access.log;

    # Production mounts the client at /app; Metro dev uses root paths.
    location = /app {
        return 302 /$is_args$args;
    }

    location = /app/ {
        return 302 /$is_args$args;
    }

    location ~ ^/app(?<app_path>/[^/].*)$ {
        return 302 $app_path$is_args$args;
    }

    # Flask APIs, authentication, and local static or support routes stay on
    # the same localhost origin as the Expo client.
    location ^~ /api/ {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }

    # The slashless Expo route is distinct from Flask's legacy /admin/ console.
    location = /admin {
        proxy_pass $metro_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/ {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }

    location = /intake {
        proxy_pass $metro_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /intake/ {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }

    location = /vaauth {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }

    location ^~ /vaauth/ {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }

    location ^~ /static/ {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }

    location ~ ^/(help|profile|download|health|public-demo|questionnaire-translations|who-va-documents)(/|$) {
        proxy_pass $clinical_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DigitVA-Public-Ingress "1";
    }

    location = /hot {
        proxy_pass $metro_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass $metro_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
