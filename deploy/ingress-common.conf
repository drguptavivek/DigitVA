# http-level settings shared by both ingress server files.
log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';

# ponytail: forwarded headers from the DMZ reverse proxy pass through unchanged
# so ProxyFix(x_for=1, x_proto=1) in the apps sees the real client and https.
# The cloud firewall (only the RP VM can reach this ingress) is the trust
# boundary; if the ingress port is ever reachable by clients directly they can
# spoof their IP. Upgrade path: the real_ip module with set_real_ip_from <RP IP>.
map $http_x_forwarded_for $fwd_for {
    "" $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_forwarded_proto $fwd_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}
