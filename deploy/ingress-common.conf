# http-level settings shared by both ingress server files.
log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';

# ponytail: forwarded headers from the DMZ reverse proxy pass through unchanged
# so ProxyFix(x_for=1, x_proto=1) in the apps sees the real client and https.
# The cloud firewall (only the RP VM can reach this ingress) is the trust
# boundary; if the ingress port is ever reachable by clients directly they can
# spoof their IP. Upgrade path: the real_ip module with set_real_ip_from <RP IP>.
map $http_x_forwarded_for $fwd_for {
    "" $remote_addr;
    default $http_x_forwarded_for;
}

map $http_x_forwarded_proto $fwd_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
}

# Compress text responses. Flask does not compress, except the instrument
# definition route, which sets Content-Encoding itself; nginx skips a response
# that already has one, so nothing is compressed twice. gzip_types lists only text-like types, so images,
# audio, zip and apk pass through untouched; text/html is always on. Attachment
# downloads are binary types and are not listed. nginx turns a strong ETag
# into a weak one when it compresses; If-None-Match still revalidates.
# No brotli: the stock nginx image has no module for it.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
