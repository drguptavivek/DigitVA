# HTTPS ingress of the public demo (docker-compose.demo.yml, demo_ingress). The
# nginx image renders this template into conf.d/default.conf at start,
# substituting ${DEMO_PROXY_FROM} only (nginx's own $variables are untouched).
#
# One host, one upstream: the DMZ reverse proxy sends demo.causeofdeathindia.com
# here over verified TLS. No DORIS-public routes and no case export; the main
# ingress (deploy/ingress-routes.conf) is not involved.

log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/digitva-app/tls/server.crt;
    ssl_certificate_key /etc/digitva-app/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/access.log privacy;
    # 10 MB attachments (PUBLIC_DEMO_ATTACHMENT_MAX_BYTES) plus multipart
    # overhead; the app answers an over-cap file itself.
    client_max_body_size 12m;

    # Real client IP. The app runs ProxyFix(x_for=1): it believes the LAST
    # X-Forwarded-For entry and expects exactly one hop to have appended it.
    # That hop is the DMZ proxy (proxy_set_header X-Forwarded-For
    # $proxy_add_x_forwarded_for). So this ingress must NOT append again (the
    # app would then see the DMZ's address for every visitor and the per-IP
    # sign-up limit would lock the whole demo): it takes the last entry from
    # the DMZ proxy and only from it, and hands the app exactly that one
    # address. Any other peer's header is ignored ($remote_addr stays the
    # peer), and a wrong DEMO_PROXY_FROM fails safe (everyone shares the
    # proxy's address) instead of trusting a header a visitor wrote.
    set_real_ip_from ${DEMO_PROXY_FROM};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Docker DNS, re-resolved so an app container restart leaves no stale
    # upstream IP (502). A variable proxy_pass without a URI part forwards the
    # original request URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo_upstream http://demo_app_service:5000;

    location / {
        proxy_pass $demo_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Marks the DORIS-demo help page for the main ingress only; a visitor
        # must not be able to send it.
        proxy_set_header X-DigitVA-Public-Ingress "";
    }
}

# Container healthcheck only: plain HTTP on the loopback, not published.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health {
        return 200 "ok\n";
    }
}
