# Routing shared by the plain-HTTP ingress (doris-public-nginx.conf) and the
# HTTPS one for split production (doris-public-nginx-tls.conf); included
# inside their server block.
access_log /var/log/nginx/access.log privacy;
# Above the 50 MB attachment cap (docs/policy/web-intake.md), so the app,
# not nginx's 1 MB default, answers an over-cap upload.
client_max_body_size 55m;

# Docker DNS, re-resolved so app container restarts do not leave a stale
# upstream IP (502) until the ingress restarts. Variable proxy_pass
# without a URI part forwards the original request URI unchanged.
resolver 127.0.0.11 valid=10s ipv6=off;
set $clinical_upstream http://minerva_app_service:5000;
set $public_upstream http://doris_public_service:5001;

location = /help/doris-demo {
    proxy_pass $public_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $fwd_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
}

location ^~ /api/v1/doris-demo/ {
    proxy_pass $public_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $fwd_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
}

location / {
    proxy_pass $clinical_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $fwd_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-DigitVA-Public-Ingress "1";
}
