# Routing shared by the plain-HTTP ingress (doris-public-nginx.conf) and the
# HTTPS one for split production (doris-public-nginx-tls.conf); included
# inside their server block.
access_log /var/log/nginx/access.log privacy;
# Above the 50 MB attachment cap (docs/policy/web-intake.md), so the app,
# not nginx's 1 MB default, answers an over-cap upload.
client_max_body_size 55m;

# Docker DNS, re-resolved so app container restarts do not leave a stale
# upstream IP (502) until the ingress restarts. Variable proxy_pass
# without a URI part forwards the original request URI unchanged.
resolver 127.0.0.11 valid=10s ipv6=off;
set $clinical_upstream http://minerva_app_service:5000;
set $public_upstream http://doris_public_service:5001;

# Maintenance (deploy/maintenance/). Two triggers, one page, always 503 with
# Retry-After and no caching: (a) nginx itself got no usable answer from the
# app (502/503/504 while a container restarts); (b) the deploy script's flag
# file exists. The flag is tested per request, so no nginx restart or reload.
# /api/ gets JSON (the mobile app keeps its data and retries); the rest HTML.
# /nginx-health stays up so the ingress can still be probed.
error_page 502 503 504 =503 @maintenance;
# Lets the 405 inside @maintenance (static file, non-GET) reach @maintenance_text.
recursive_error_pages on;
set $maint "";
if (-f /etc/nginx/digitva/maintenance/on) { set $maint "f"; }
if ($uri != /nginx-health) { set $maint "${maint}x"; }
if ($maint = fx) { return 503; }

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location @maintenance {
    root /etc/nginx/digitva/maintenance;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
    if ($uri ~ ^/api/) { rewrite ^ /maintenance-api last; }
    rewrite ^ /maintenance.html break;
    # The static handler refuses POST/PUT/DELETE with 405; answer 503 text.
    error_page 405 =503 @maintenance_text;
}

# Inline body, not a file: static files cannot answer non-GET methods.
location = /maintenance-api {
    internal;
    default_type application/json;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":{"code":"maintenance","message":"DigitVA is being updated. Try again in a few minutes; your data is safe."}}';
}

location @maintenance_text {
    default_type text/plain;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
    return 503 "DigitVA is being updated. Try again in a few minutes; your data is safe.\n";
}

location = /help/doris-demo {
    proxy_pass $public_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $fwd_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
}

location ^~ /api/v1/doris-demo/ {
    proxy_pass $public_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $fwd_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
}

# The case list CSV export streams registration numbers in plaintext: no
# buffering and no spool file on the ingress disk (the app also sends
# X-Accel-Buffering: no). Exact match, so it wins over "location /".
location = /api/v1/cases/export.csv {
    proxy_pass $clinical_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $fwd_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-DigitVA-Public-Ingress "1";
    proxy_buffering off;
    proxy_max_temp_file_size 0;
}

location / {
    proxy_pass $clinical_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $fwd_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-DigitVA-Public-Ingress "1";
}
