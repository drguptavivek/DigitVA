[workspace]
resolver = "2"
members = [
    "crates/digitva-smartva",
    "crates/digitva-pdf",
    "crates/digitva-icd11",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["DigitVA Engineering"]

[workspace.dependencies]
anyhow = "1.0"
csv = "1.3"
libloading = "0.8"
plotters = "0.3.7"
regex = "1.11"
rust_xlsxwriter = "0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
