[workspace]
resolver = "2"
members = [
    "crates/digitva-text",
    "crates/digitva-pii",
    "crates/digitva-bundle",
    "crates/digitva-smartva",
    "crates/digitva-pdf",
    "crates/digitva-icd11",
    "crates/digitva-db",
    "crates/digitva-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["DigitVA Engineering"]

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
libloading = "0.8"
ml-kem = "0.2"
plotters = "0.3.7"
rand = "0.8"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
rust_xlsxwriter = "0.100"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
unicode-normalization = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
