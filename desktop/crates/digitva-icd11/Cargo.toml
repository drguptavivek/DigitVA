[package]
name = "digitva-icd11"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DigitVA wrapper around the pure-Rust who-icd11-api engine (vendor/who-icd11-api)"

[lib]
name = "digitva_icd11"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "digitva-icd11-server"
path = "src/bin/digitva_icd11_server.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
who-icd11-api = { path = "../../../vendor/who-icd11-api" }
