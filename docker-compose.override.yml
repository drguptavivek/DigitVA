services:
  minerva_app_service:
    environment:
      # Dev serves its own `npm run export:web` build from the checkout, not
      # the pinned release in the image.
      - EXPO_CLIENT_DIST=/app/mobile/digitva-collect/dist
      - FLASK_DEBUG=1
      - FLASK_ENV=development
      # Dev .env may carry the production PUBLIC_BASE_URL; passkeys on dev must
      # use the browser's actual origin or navigator.credentials refuses them.
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_ORIGIN=http://localhost:8051
    ports:
      - "8051:5000"
    # Dev only: the parallel test suite (pytest -n 4) runs in this container,
    # and four workers do not fit in the 1g production limit; 3g was hit
    # (OOM-killed workers) once the suite passed ~7,500 tests.
    deploy:
      resources:
        limits:
          memory: 8g
    entrypoint: []
    command: >
      bash -c "
        echo '[dev] Syncing dependencies...' &&
        uv sync --frozen &&
        echo '[dev] Syncing SmartVA package data...' &&
        uv run python scripts/sync_smartva_package_data.py &&
        echo '[dev] Waiting for database...' &&
        until flask db upgrade; do
          echo 'DB not ready, retrying in 5s...'
          sleep 5
        done &&
        flask run --host=0.0.0.0 --port=5000
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 20s

  minerva_db_service:
    # Dev only: parallel test suites and several sessions share this Postgres;
    # the 756m production limit OOM-killed backends during -n 4 runs.
    # max_locks_per_transaction: each xdist worker's create_all/drop_all over the
    # full schema exhausted the default 64 ("out of shared memory", digitva-kdf8).
    # The rest repeats docker-compose.yml's command, which `command` replaces whole.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c max_connections=40
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c idle_in_transaction_session_timeout=30000
      -c log_min_duration_statement=1000
      -c max_locks_per_transaction=256
    deploy:
      resources:
        limits:
          memory: 1g
