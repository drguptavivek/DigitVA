services:
  minerva_app_service:
    environment:
      # Dev serves its own `npm run export:web` build from the checkout, not
      # the pinned release in the image.
      - EXPO_CLIENT_DIST=/app/mobile/digitva-collect/dist
      - FLASK_DEBUG=1
      - FLASK_ENV=development
      # Dev .env may carry the production PUBLIC_BASE_URL; passkeys on dev must
      # use the browser's actual origin or navigator.credentials refuses them.
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_ORIGIN=http://localhost:8051
    ports:
      - "8051:5000"
    # Dev only: the parallel test suite (pytest -n 4) runs in this container,
    # and four workers do not fit in the 1g production limit.
    deploy:
      resources:
        limits:
          memory: 3g
    entrypoint: []
    command: >
      bash -c "
        echo '[dev] Syncing dependencies...' &&
        uv sync --frozen &&
        echo '[dev] Syncing SmartVA package data...' &&
        uv run python scripts/sync_smartva_package_data.py &&
        echo '[dev] Waiting for database...' &&
        until flask db upgrade; do
          echo 'DB not ready, retrying in 5s...'
          sleep 5
        done &&
        flask run --host=0.0.0.0 --port=5000
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 20s

  minerva_db_service:
    # Dev only: parallel test suites and several sessions share this Postgres;
    # the 756m production limit OOM-killed backends during -n 4 runs.
    deploy:
      resources:
        limits:
          memory: 1g
