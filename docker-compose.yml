# smartva-rs: pinned release asset of drguptavivek/SmartVA-Analyze-rust, passed
# as build args to every service built from the app Dockerfile, which
# downloads it and verifies the SHA-256 (hosts never compile Rust). Bumping is
# an edit here only; an empty pin fails the build for that architecture.
# SMARTVA_RS_SOURCE=source in .env compiles vendor/smartva-analyze/rust
# instead (developers only, never on a host).
# The Expo web export is the same: a pinned DigitVA release (expo-web-v<date>)
# downloaded and verified into /opt/digitva/expo-client (EXPO_CLIENT_DIST), so
# hosts never run Node; dev serves its own local build instead (override file).
# The Android APK likewise: one asset of a CI-published DigitVA release
# (android-v<version>), downloaded and verified into /opt/digitva/android and
# served at /download/android beside the GitHub releases link. Empty = none.
x-release-pins: &release-pins
  ANDROID_APK_TAG: "android-v0.2.0"
  ANDROID_APK_ASSET: "digitva-collect-0.2.0-arm64-v8a.apk"
  ANDROID_APK_SHA256: "221060a9bc0819ac199e56c2c5d80d916027c8f49c865c2b4edb74a78979e40c"
  EXPO_WEB_TAG: "expo-web-v2026.10.22.4"
  EXPO_WEB_SHA256: "41b5ce413b5b5ee52dd56d9971d370079a89bae35adc95eb9ac79e48d9c81549"
  SMARTVA_RS_SOURCE: ${SMARTVA_RS_SOURCE:-release}
  SMARTVA_RS_VERSION: "v3.0.1"
  SMARTVA_RS_SHA256_ARM64: "aba6925d9868d43ca78d580ab1b698cb2bdc3bbd62eba32528459a55ec10be54"
  SMARTVA_RS_SHA256_AMD64: "be77a5cfc01efd4f50422ced1389f59232258f6eef659accbdb4e495efa6fa8c"

services:
  # WHO ICD-11 API 2.6.0 + DORIS 1.2.0: WHO's own whoicd/icd-api container
  # (owner decision 2026-10-22: licensing for the Rust host below is
  # unresolved, so servers keep the WHO container).
  icd_api_service:
    image: whoicd/icd-api:2.6.0@sha256:1b77eb6dc43e0c65a12e9e9340ad178493c93488e728d0d936507cc57ada1b7c
    profiles: [icd11]
    # digitva_icd is the only network the public demo joins (docker-compose.demo.yml).
    networks:
      default: {}
      digitva_icd:
        aliases: [icd_api_service]
    environment:
      acceptLicense: "true"
      saveAnalytics: "false"
      enableDoris: "true"
      include: 2026-01_en
    ports:
      - "127.0.0.1:8382:80"
    restart: always
    # Measured 270-490 MB idle, 0.9 GB peak after 1,200 distinct searches; it
    # was OOM-killed at this cap once, so it is not lowered (digitva-cfb1).
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      # Runs a real DORIS certificate: green only when the engine answers, not
      # when the port is merely open (digitva-cfb1). The image has busybox wget.
      test:
        - CMD-SHELL
        - >-
          wget -q -O - --header 'API-Version: v2' --header 'Accept-Language: en'
          --header 'Content-Type: application/json'
          --post-data '{"ICDVersion":"ICD11","AdministrativeData":{"Sex":1,"EstimatedAge":"P62Y"},"Part1":[{"Conditions":[{"Code":"BA41.Z"}]}]}'
          http://127.0.0.1/icd/release/11/2026-01/doris | grep -q '"stemCode":"BA41.Z"'
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 3m

  # Opt-in only; NOT for staging or production until ICD-11 licensing for it
  # is resolved. The same WHO API hosted in-process by the Rust binary
  # digitva-icd11-server (docker/icd11/Dockerfile, compiled from source). It
  # takes the icd_api_service hostname and host port, so never run both:
  # `docker compose stop icd_api_service`, then
  # `docker compose --profile icd11-rust up -d icd_api_rust_service`.
  icd_api_rust_service:
    build:
      context: .
      dockerfile: docker/icd11/Dockerfile
    profiles: [icd11-rust]
    networks:
      default:
        aliases: [icd_api_service]
    volumes:
      - icd11_runtime:/var/lib/icd11
    ports:
      - "127.0.0.1:8382:80"
    restart: always
    # Measured 2026-10-22: ~540-680 MB idle, ~1.1 GB peak after 1,200 distinct
    # searches (WHO caches searches for an hour).
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      # Runs a real DORIS certificate: green only when the engine is loaded.
      test: ["CMD", "icd11-healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 3m

  minerva_app_service:
    build:
      context: .
      args: *release-pins
    container_name: minerva_app
    command: ./boot.sh
    volumes:
      - .:/app
      - minerva_venv:/app/.venv
    environment:
      - EXPO_CLIENT_DIST=${EXPO_CLIENT_DIST:-/opt/digitva/expo-client}
      - SECRET_KEY=${SECRET_KEY}
      - CAPTCHA_HMAC_KEY=${CAPTCHA_HMAC_KEY:-}
      - AUTH_FACTOR_ENCRYPTION_KEY=${AUTH_FACTOR_ENCRYPTION_KEY:-}
      - PII_KEM_PUBLIC_KEY=${PII_KEM_PUBLIC_KEY:-}
      - PII_KEM_KEY_ID=${PII_KEM_KEY_ID:-}
      - PII_BLIND_INDEX_KEY=${PII_BLIND_INDEX_KEY:-}
      - PII_KEM_PRIVATE_KEY_FILE=/run/secrets/pii_kem_private_key
      - PII_KEM_PREVIOUS_PRIVATE_KEY_FILES=${PII_KEM_PREVIOUS_PRIVATE_KEY_FILES:-}
      - BUNDLE_SERVER_SIGNING_KEY_FILE=/run/secrets/bundle_server_signing_key
      # PII slice 1b part II-A; keep false (docs/kb/pii-slice-1b.md, "Release procedure").
      - PAYLOAD_PII_SPLIT_ENABLED=${PAYLOAD_PII_SPLIT_ENABLED:-false}
      - REGISTER_PII_SPLIT_ENABLED=${REGISTER_PII_SPLIT_ENABLED:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - ICD11_API_BASE_URL=http://icd_api_service
    secrets:
      - pii_kem_private_key
      - bundle_server_signing_key
    depends_on:
      - minerva_db_service
      - minerva_redis_service
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      # X-Forwarded-Proto: Talisman would otherwise redirect this plain-HTTP
      # probe to HTTPS in production and the check would never pass.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:5000/health', headers={'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 20s

  doris_public_service:
    profiles: [icd11]
    build:
      context: .
      args: *release-pins
    command: ./boot-public-doris.sh
    entrypoint: []
    # No bind mount of the checkout: the internet-facing training service runs
    # the image's own copy (built without .env and private/, .dockerignore), so
    # it can read neither the PII private key nor PII_BLIND_INDEX_KEY. Code
    # changes reach it with `make prod-build` (every deploy rebuilds).
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - CAPTCHA_HMAC_KEY=${CAPTCHA_HMAC_KEY:-}
      - AUTH_FACTOR_ENCRYPTION_KEY=${AUTH_FACTOR_ENCRYPTION_KEY:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - ICD11_API_BASE_URL=http://icd_api_service
      - DORIS_PUBLIC_COOKIE_SECURE=${DORIS_PUBLIC_COOKIE_SECURE:-false}
    depends_on:
      icd_api_service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 192m
    healthcheck:
      # X-Forwarded-Proto: Talisman would otherwise redirect this plain-HTTP
      # probe to HTTPS in production and the check would never pass.
      # The second request runs DORIS on the ICD service: this service is
      # useless without it, so its health must follow it (digitva-cfb1).
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://localhost:5001/health', headers={'X-Forwarded-Proto': 'https'}), timeout=3); u.urlopen(u.Request(os.environ['ICD11_API_BASE_URL'] + '/icd/release/11/2026-01/doris', data=b'{\"ICDVersion\":\"ICD11\",\"AdministrativeData\":{\"Sex\":1,\"EstimatedAge\":\"P62Y\"},\"Part1\":[{\"Conditions\":[{\"Code\":\"BA41.Z\"}]}]}', headers={'API-Version': 'v2', 'Accept-Language': 'en', 'Content-Type': 'application/json'}), timeout=6)"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 10s

  digitva_ingress:
    profiles: [icd11]
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8052:80"
    volumes:
      - ./deploy/doris-public-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ingress-common.conf:/etc/nginx/digitva/ingress-common.conf:ro
      - ./deploy/ingress-routes.conf:/etc/nginx/digitva/ingress-routes.conf:ro
    depends_on:
      minerva_app_service:
        condition: service_healthy
      doris_public_service:
        condition: service_healthy
    restart: always

  minerva_celery_worker:
    build:
      context: .
      args: *release-pins
    container_name: minerva_celery_worker
    entrypoint: []
    # The child keeps SmartVA's trained models in memory (in-process engine,
    # SMARTVA_RS_LIB): measured child peak 236-240 MiB on SmartVA work, so the
    # cap sits above it, or every task would recycle the child and lose them.
    command: celery -A make_celery:celery_app worker --loglevel=info --concurrency=1 --max-memory-per-child=300000
    volumes:
      - .:/app
      - minerva_venv:/app/.venv
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - CAPTCHA_HMAC_KEY=${CAPTCHA_HMAC_KEY:-}
      - AUTH_FACTOR_ENCRYPTION_KEY=${AUTH_FACTOR_ENCRYPTION_KEY:-}
      - PII_KEM_PUBLIC_KEY=${PII_KEM_PUBLIC_KEY:-}
      - PII_KEM_KEY_ID=${PII_KEM_KEY_ID:-}
      - PII_BLIND_INDEX_KEY=${PII_BLIND_INDEX_KEY:-}
      - PII_KEM_PRIVATE_KEY_FILE=/run/secrets/pii_kem_private_key
      - PII_KEM_PREVIOUS_PRIVATE_KEY_FILES=${PII_KEM_PREVIOUS_PRIVATE_KEY_FILES:-}
      # PII slice 1b part II-A; keep false (docs/kb/pii-slice-1b.md, "Release procedure").
      - PAYLOAD_PII_SPLIT_ENABLED=${PAYLOAD_PII_SPLIT_ENABLED:-false}
      - REGISTER_PII_SPLIT_ENABLED=${REGISTER_PII_SPLIT_ENABLED:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
    secrets:
      - pii_kem_private_key
    depends_on:
      minerva_app_service:
        condition: service_healthy
      minerva_db_service:
        condition: service_healthy
      minerva_redis_service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 400m

  minerva_celery_beat:
    build:
      context: .
      args: *release-pins
    container_name: minerva_celery_beat
    entrypoint: []
    command: bash ./scripts/wait-for-celery-beat-db.sh
    volumes:
      - .:/app
      - minerva_venv:/app/.venv
    # Beat never holds the PII private key (owner decision 13): no secret, and
    # the checkout's private/ (the development key) is masked by an empty
    # tmpfs. pii_crypto.init_app refuses to start in production if a key file
    # is still readable here. Beat does hold PII_BLIND_INDEX_KEY: every
    # process that boots the app needs it, and .env reaches it via load_dotenv.
    tmpfs:
      - /app/private:size=1m,mode=0700
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - CAPTCHA_HMAC_KEY=${CAPTCHA_HMAC_KEY:-}
      - AUTH_FACTOR_ENCRYPTION_KEY=${AUTH_FACTOR_ENCRYPTION_KEY:-}
      - PII_KEM_PUBLIC_KEY=${PII_KEM_PUBLIC_KEY:-}
      - PII_KEM_KEY_ID=${PII_KEM_KEY_ID:-}
      - PII_BLIND_INDEX_KEY=${PII_BLIND_INDEX_KEY:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
    depends_on:
      minerva_app_service:
        condition: service_healthy
      minerva_db_service:
        condition: service_healthy
      minerva_redis_service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 384m

  minerva_redis_service:
    image: redis:7
    container_name: minerva_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy volatile-lru
    restart: always
    deploy:
      resources:
        limits:
          memory: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minerva_db_service:
    image: postgres:17
    container_name: minerva_db
    # Tuned for 1.87 GB host with 183 MB database and ≤24 application connections.
    # shared_buffers=128MB keeps entire DB hot in cache (DB is 183MB).
    # max_connections=40 matches pool headroom (3 services × 8 max = 24 + 16 admin margin).
    # idle_in_transaction_session_timeout kills hung transactions after 30s.
    # tcp_keepalives_idle detects dead connections within 60s.
    # log_min_duration_statement logs queries slower than 1s for performance diagnosis.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c max_connections=40
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c idle_in_transaction_session_timeout=30000
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_minerva:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 756m
        reservations:
          memory: 386m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerva"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# The KEM private key (app/utils/pii_crypto.py): mounted into the app and the
# worker only, never beat or DORIS. The default below is the DEVELOPMENT key
# in the git-ignored private/ of the checkout (`make ensure-secrets`). The
# prod make targets pass PII_KEM_PRIVATE_KEY_PATH outside the checkout
# (default /data/digitva-secrets/pii_kem_private_key, mode 0600, deploy user;
# `make ensure-secrets-prod` refuses a path under the checkout), because the
# checkout is bind-mounted into every app container. Back it up apart from
# the database.
secrets:
  pii_kem_private_key:
    file: ${PII_KEM_PRIVATE_KEY_PATH:-./private/pii_kem_private_key}
  # The server Ed25519 key that signs station configs
  # (app/services/station_config_service.py): app only, same custody as the
  # KEM key (`make ensure-secrets` / `ensure-secrets-prod`). Stations pin its
  # public key at first import; losing it means re-pinning every station.
  bundle_server_signing_key:
    file: ${BUNDLE_SERVER_SIGNING_KEY_PATH:-./private/bundle_server_signing_key}

networks:
  digitva_icd:
    name: digitva_icd

volumes:
  pgdata_minerva:
  icd11_runtime:
  minerva_venv:
