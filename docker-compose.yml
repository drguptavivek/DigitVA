services:
  icd_api_service:
    image: whoicd/icd-api:2.6.0@sha256:1b77eb6dc43e0c65a12e9e9340ad178493c93488e728d0d936507cc57ada1b7c
    profiles: [icd11]
    environment:
      acceptLicense: "true"
      saveAnalytics: "false"
      enableDoris: "true"
      include: 2026-01_en
    ports:
      - "127.0.0.1:8382:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "API-Version: v2", "--header", "Accept-Language: en", "http://127.0.0.1/icd/release/11/2026-01/mms/search?q=diabetes"]
      interval: 2m
      timeout: 10s
      retries: 3

  minerva_app_service:
    build: .
    container_name: minerva_app
    command: ./boot.sh
    volumes:
      - .:/app
      - minerva_venv:/app/.venv
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - ICD11_API_BASE_URL=http://icd_api_service
    depends_on:
      - minerva_db_service
      - minerva_redis_service
    restart: always
    deploy:
      resources:
        limits:
          memory: 756m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 20s

  doris_public_service:
    profiles: [icd11]
    build: .
    command: ./boot-public-doris.sh
    entrypoint: []
    volumes:
      - .:/app
      - minerva_venv:/app/.venv
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - ICD11_API_BASE_URL=http://icd_api_service
      - DORIS_PUBLIC_COOKIE_SECURE=${DORIS_PUBLIC_COOKIE_SECURE:-false}
    depends_on:
      icd_api_service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 192m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 10s

  digitva_ingress:
    profiles: [icd11]
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8052:80"
    volumes:
      - ./deploy/doris-public-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minerva_app_service:
        condition: service_healthy
      doris_public_service:
        condition: service_healthy
    restart: always

  minerva_celery_worker:
    build: .
    container_name: minerva_celery_worker
    entrypoint: []
    command: celery -A make_celery:celery_app worker --loglevel=info --concurrency=1
    volumes:
      - .:/app
      - minerva_venv:/app/.venv
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
    depends_on:
      minerva_app_service:
        condition: service_healthy
      minerva_db_service:
        condition: service_healthy
      minerva_redis_service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 400m

  minerva_celery_beat:
    build: .
    container_name: minerva_celery_beat
    entrypoint: []
    command: bash ./scripts/wait-for-celery-beat-db.sh
    volumes:
      - .:/app
      - minerva_venv:/app/.venv
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@minerva_db_service:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@minerva_redis_service:6379/0
    depends_on:
      minerva_app_service:
        condition: service_healthy
      minerva_db_service:
        condition: service_healthy
      minerva_redis_service:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 192m

  minerva_redis_service:
    image: redis:7
    container_name: minerva_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    restart: always
    deploy:
      resources:
        limits:
          memory: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minerva_db_service:
    image: postgres:17
    container_name: minerva_db
    # Tuned for 1.87 GB host with 183 MB database and ≤24 application connections.
    # shared_buffers=128MB keeps entire DB hot in cache (DB is 183MB).
    # max_connections=40 matches pool headroom (3 services × 8 max = 24 + 16 admin margin).
    # idle_in_transaction_session_timeout kills hung transactions after 30s.
    # tcp_keepalives_idle detects dead connections within 60s.
    # log_min_duration_statement logs queries slower than 1s for performance diagnosis.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c max_connections=40
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c idle_in_transaction_session_timeout=30000
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_minerva:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 756m
        reservations:
          memory: 386m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerva"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata_minerva:
  minerva_venv:
