<text x="178" y="105" font-size="12.5" font-weight="bold" fill="#222">Project lead</text>
<text x="178" y="122" font-size="11.5" fill="#5E35B1">Sees and manages every</text>
<text x="178" y="136" font-size="11.5" fill="#5E35B1">district</text>
