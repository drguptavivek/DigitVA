<text x="178" y="596" font-size="11.5" fill="#9E9E9E">planned)</text>
<rect x="1246" y="162" width="234" height="224" rx="10" fill="#FFFDE7" stroke="#F9A825" stroke-dasharray="6 4"/>
<text x="1260" y="188" font-size="16" font-weight="bold" fill="#5D4037">Medical college</text>
<text x="1260" y="205" font-size="12" fill="#5D4037">(outside the chain,</text>
<text x="1260" y="222" font-size="12" fill="#5D4037">linked to the districts</text>
<text x="1260" y="239" font-size="12" fill="#5D4037">it supports)</text>
<text x="1260" y="256" font-size="12" fill="#5D4037"></text>
<text x="1260" y="273" font-size="12" font-weight="bold" fill="#5D4037">Mentors (faculty, residents):</text>
<text x="1260" y="290" font-size="12" fill="#5D4037">coder, reviewer,</text>
<text x="1260" y="307" font-size="12" fill="#5D4037">coding tester or</text>
<text x="1260" y="324" font-size="12" fill="#5D4037">viewer with names</text>
<text x="1260" y="341" font-size="12" fill="#5D4037"></text>
<text x="1260" y="358" font-size="12" font-weight="bold" fill="#5D4037">College admin: adds and</text>
<text x="1260" y="375" font-size="12" fill="#5D4037">removes its own staff only</text>
<line x1="1206" y1="205" x2="1246" y2="205" stroke="#F9A825" stroke-width="2" stroke-dasharray="5 4"/>
