<svg xmlns="http://www.w3.org/2000/svg" width="1496" height="732" viewBox="0 0 1496 732" font-family="Helvetica, Arial, sans-serif">
<rect width="1496" height="732" fill="#ffffff"/>
<text x="24" y="38" font-size="22" font-weight="bold" fill="#222">Who works at each level of a district project</text>
<text x="24" y="58" font-size="13" fill="#666">A role given at a level covers that level and everything below it, never the level above.</text>
