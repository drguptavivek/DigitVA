# Subflow: answer what the current form page shows, then stop (the caller taps Next).
# Every step is guarded by what is visible and not yet selected, so it is safe to run
# twice on a page and on any age path. Answers: "no" to every yes/no question
# (except consent Id10013, which the consent screens set, and Id10310, which needs
# "yes"), then the fixed choices below, a deceased who is a 70-year-old woman. Each
# page is swept, scrolled and swept twice more: a long page shows five or six questions at a
# time. Built from the bundled instrument's required questions for an adult woman.
# Speed: the fixed answers run only when one of their questions is on screen.
appId: com.causeofdeathindia.digitvacollect.plus
---
- repeat:
    while:
      visible:
        id: "question-(?!Id10013-|Id10310-|Id10020-|Id10022-).*-choice-no"
        selected: false
    times: 12
    commands:
      - tapOn:
          id: "question-(?!Id10013-|Id10310-|Id10020-|Id10022-).*-choice-no"
          selected: false
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 200
# The form's own consent question (Id10013) is not set by the consent screens: answer yes.
- runFlow:
    when:
      visible:
        id: "question-Id10013-choice-yes"
        selected: false
    commands:
      - tapOn:
          id: "question-Id10013-choice-yes"
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 200
# Social autopsy (TST002): no insurance, died at home, no care sought because death came soon.
- runFlow:
    when:
      visible:
        id: "question-sa0[136]-choice-.*"
    commands:
    - runFlow:
        when:
          visible:
            id: "question-sa01-choice-6"
            selected: false
        commands:
          - tapOn:
              id: "question-sa01-choice-6"
