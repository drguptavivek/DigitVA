# Subflow: from Home reopen the newest draft and assert the answers written by
# new-interview.yaml (consent Yes + respondent Female) are intact, then leave.
appId: com.causeofdeathindia.digitvacollect.plus
---
- tapOn:
    text: "Resume draft"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 200
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "question-Id10013-choice-yes"
- assertVisible:
    id: "question-Id10013-choice-yes"
    selected: true
- scrollUntilVisible:
    centerElement: true
    element:
      id: "question-Id10007a-choice-female"
    direction: UP
- assertVisible:
    id: "question-Id10007a-choice-female"
    selected: true
- tapOn:
    id: "header-back"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 200
- waitForAnimationToEnd
- tapOn:
    id: "tab-home"
    optional: true
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 200
