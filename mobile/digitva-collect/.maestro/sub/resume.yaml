# Subflow: bring the app back (no restart) after Home or a lock; unlock if it asks
# for the PIN; leave any open form by its Back arrow; land on Home.
appId: com.causeofdeathindia.digitvacollect.plus
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Enter your PIN to unlock this phone."
    file: unlock.yaml
- tapOn:
    id: "header-back"
    optional: true
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 200
- waitForAnimationToEnd
- tapOn:
    id: "tab-home"
    optional: true
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 200
- assertVisible:
    id: "tab-home"
