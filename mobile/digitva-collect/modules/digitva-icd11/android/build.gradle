plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.digitvaicd11'
version = '0.1.0'

// This module is linked only in the Collect Plus build (APP_VARIANT=plus; plugins/with-android-collect-plus.js keeps
// it out of the plain build). The engine and its data are staged from private/ by scripts/stage-engine.js and are
// git-ignored. Fail the build here, with a plain message, rather than ship a Plus APK without them.
def stagedLib = file('src/main/jniLibs/arm64-v8a/libdigitva_icd11.so')
def stagedData = file('src/main/assets/digitva-icd11/data')
tasks.register('verifyEngineStaged') {
  doLast {
    if (!stagedLib.exists() || !stagedData.isDirectory()) {
      throw new GradleException(
        'Collect Plus: the offline ICD-11 engine is not staged. Run "node modules/digitva-icd11/scripts/stage-engine.js" ' +
        'from mobile/digitva-collect (it needs private/icd11-offline-spike/ in the main checkout), or re-run ' +
        '"APP_VARIANT=plus npx expo prebuild --platform android".')
    }
  }
}
preBuild.dependsOn 'verifyEngineStaged'

// The engine's .NET runtime dlopens libssl by name (libssl.so.3, .1.1, .1.0.2 ..., then libssl.so) and aborts when
// none loads, and Android exposes no system OpenSSL to apps. The OpenSSL prebuilt that expo-sqlite already depends on
// (io.github.ronickg:openssl, OpenSSL 3.3.2, Apache-2.0; prefab AAR, pulled at build time, not vendored) supplies the
// matching libssl.so. Its libcrypto.so is not copied here: expo-sqlite packages the same artifact's libcrypto.so under
// the same name, and libssl.so loads that one. Google's NDK OpenSSL AAR (only 1.1.1q is published) was rejected: its
// libssl needs a libcrypto.so 1.1 ABI, which cannot sit beside expo-sqlite's 3.3.2 libcrypto in one APK.
// The AAR has no jni/ folder, only prefab libs, so the arm64 libssl.so is copied out of it into a build dir.
def opensslVersion = '3.3.2-1'
configurations {
  opensslAar
}
dependencies {
  opensslAar "io.github.ronickg:openssl:${opensslVersion}@aar"
}
def opensslLibsDir = layout.buildDirectory.dir('openssl-jnilibs/arm64-v8a')
tasks.register('extractOpenSsl', Copy) {
  from { configurations.opensslAar.collect { zipTree(it) } }
  include 'prefab/modules/ssl/libs/android.arm64-v8a/libssl.so'
  includeEmptyDirs = false
  eachFile { details -> details.relativePath = new RelativePath(true, details.name) }
  into opensslLibsDir
}
preBuild.dependsOn 'extractOpenSsl'

android {
  namespace "expo.modules.digitvaicd11"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    ndk { abiFilters 'arm64-v8a' }
  }
  sourceSets {
    main {
      jniLibs.srcDir(layout.buildDirectory.dir('openssl-jnilibs').get().asFile)
    }
  }
  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version '3.22.1'
    }
  }
  lintOptions {
    abortOnError false
  }
}
