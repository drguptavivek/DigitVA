plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.digitvasmartva'
version = '0.1.0'

def stagedLib = file('src/main/jniLibs/arm64-v8a/libsmartva_rust.so')
tasks.register('verifySmartvaStaged') {
  doLast {
    if (!stagedLib.exists() || stagedLib.length() == 0) {
      throw new GradleException(
        'Collect Plus: SmartVA is not staged. Run "node modules/digitva-smartva/scripts/stage-engine.js" from mobile/digitva-collect.')
    }
  }
}
preBuild.dependsOn 'verifySmartvaStaged'

android {
  namespace "expo.modules.digitvasmartva"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    ndk { abiFilters 'arm64-v8a' }
  }
  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }
  lintOptions { abortOnError false }
}
